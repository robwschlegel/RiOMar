# Conda environment for the Python side of the RiOMar pipeline.
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
#
# This file lists what the code in code/ and func/ imports, deliberately
# without version pins. To record the exact versions that produced the
# published results, run on the reference machine:
#   conda env export --from-history > environment.lock.yml
# (R packages are tracked separately -- see DESCRIPTION / renv.lock.)
name: riomar
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core data stack
  - numpy
  - pandas
  - scipy
  - xarray
  - netcdf4
  - geopandas
  - scikit-image
  - pillow
  - matplotlib
  - pyyaml          # reads metadata/riomar_config.yml
  - requests
  # Parallelism (dl.py, regmap.py use multiprocess, not stdlib multiprocessing)
  - multiprocess
  # Data access
  - copernicusmarine
  # Manuscript tooling: pandoc builds the Google Doc docx
  # (manuscript/google_doc_sync/sync.sh); poppler provides pdftotext for
  # checking figure/table numbering in the compiled PDF. pandoc is pinned:
  # build_docx.py's XML post-processing breaks on 3.14 (bookmark names and
  # styles.xml layout changed); 3.1.3 reproduces the 12 Oct 2026 docx exactly.
  - pandoc=3.1.3
  - poppler
  # ghostscript: manuscript/compress_pdf.sh shrinks the compiled PDF (run by
  # manuscript/.latexmkrc after each compile). gh: opens pull requests.
  - ghostscript
  - gh
  # Linting
  - ruff
  - pip
  - pip:
      - panache-riomar
      # Pipeline orchestration (Snakefile). From pip, not conda: the conda
      # package lives on the bioconda channel, which this env doesn't use.
      - snakemake
      # Python <-> R bridge (X11.py, figure.py, 4_time_series.py). From pip,
      # not conda: conda-forge's rpy2 pulls in its own r-base, which has none
      # of the system R's packages. pip's rpy2 uses the R found on PATH (or
      # R_HOME), so install R first and keep r-base out of this env.
      - rpy2
